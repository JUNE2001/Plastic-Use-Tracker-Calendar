<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캘린더 및 플라스틱 사용량</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- 캘린더 영역 -->
      <div class="calendar">
        <div class="header">
          <h2 id="month-year" class="clickable">2024년 10월</h2>
        </div>
        <table id="calendar-table">
          <thead>
            <tr>
              <th>일</th>
              <th>월</th>
              <th>화</th>
              <th>수</th>
              <th>목</th>
              <th>금</th>
              <th>토</th>
            </tr>
          </thead>
          <tbody>
            <!-- 날짜가 JavaScript를 통해 여기에 채워질 것입니다. -->
          </tbody>
        </table>
      </div>

      <!-- 우측 공간: 플라스틱 사용량 표시 영역 -->
      <div class="side-box-container">
        <div class="side-box">
          <h3>선택된 날짜</h3>
          <div class="usage-info">
            <p><span id="selected-date">없음</span></p>
          </div>
        </div>
        <div class="side-box">
          <h3>배출된 플라스틱</h3>
          <div class="usage-info">
            <p>총 무게: <span id="usage-plastic">없음</span></p>
          </div>
          <div class="plastic-controls">
            <div>
              <p>소 (0.5kg): <span id="small-count">0</span></p>
              <button class="decrement" data-target="small">-</button>
              <button class="increment" data-target="small">+</button>
            </div>
            <div>
              <p>중 (1.0kg): <span id="medium-count">0</span></p>
              <button class="decrement" data-target="medium">-</button>
              <button class="increment" data-target="medium">+</button>
            </div>
            <div>
              <p>대 (2.0kg): <span id="large-count">0</span></p>
              <button class="decrement" data-target="large">-</button>
              <button class="increment" data-target="large">+</button>
            </div>
          </div>
          <button id="save-plastic-data" class="save-btn">저장</button>
        </div>
        <div class="side-box">
          <h3>이번달 플라스틱</h3>
          <div class="usage-info">
            <p>총 무게: <span id="total-monthly-plastic">없음</span></p>
          </div>
        </div>
        <div class="side-box">
          <h3>이번달과 이전달 비교</h3>
          <div class="comparison-box">
            <p id="comparison-status">데이터를 불러오는 중...</p>
            <p>현재 달 사용량: <span id="current-total">0.0</span>kg</p>
            <p>이전 달 사용량: <span id="previous-total">0.0</span>kg</p>
            <p>변화율: <span id="change-percentage">0.0</span>%</p>
          </div>
        </div>
      </div>

      <!-- Modal 창 -->
      <div id="date-modal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h2>연도 및 월 선택</h2>
          <div class="modal-selects">
            <select id="modal-year-select"></select>
            <select id="modal-month-select"></select>
          </div>
          <button id="apply-selection">적용</button>
        </div>
      </div>

      <script src="../script.js"></script>
    </div>
  </body>
</html>
